# Orchestration du socle : PostgreSQL + Keycloak + serveur MCP.
#
#   cp .env.example .env
#   docker compose up -d
#
# Asterisk, Ollama, Prometheus et Grafana NE sont PAS gérés par ce compose :
# ce sont des conteneurs séparés, déjà présents sur la machine (voir README
# « Composants externes »). Le serveur MCP s'y connecte via le réseau
# `supervision-net` et les variables ASTERISK_* / OLLAMA_* du .env.

x-common-env: &keycloak-realm
  KEYCLOAK_BASE_URL: http://keycloak:8080
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:-asterisk}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-mcp-server}

services:

  keycloak-db:
    image: postgres:16-alpine
    container_name: supervision-keycloak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [supervision-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: supervision-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: ${KC_HOSTNAME:-http://localhost:8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/realm-export:/opt/keycloak/data/import:ro
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [supervision-net]

  mcp-server:
    build: ./mcp-server
    container_name: supervision-mcp-server
    environment:
      <<: *keycloak-realm
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-keycloak}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8000}
      MCP_HITL_MODE: ${MCP_HITL_MODE:-pilotage}
      AUDIT_LOG_PATH: /app/logs/audit.jsonl
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Asterisk = conteneur externe joint à supervision-net (défaut : hostname "asterisk").
      # Si le serveur MCP ne peut pas le joindre, les outils Module 2 renvoient
      # une erreur "asterisk_unavailable" propre (le socle reste fonctionnel).
      ASTERISK_HOST: ${ASTERISK_HOST:-asterisk}
      ASTERISK_AMI_PORT: ${ASTERISK_AMI_PORT:-5038}
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-mcp_ami}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-changeme_ami}
      ASTERISK_ARI_BASE_URL: ${ASTERISK_ARI_BASE_URL:-http://asterisk:8088}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-mcp_ari}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-changeme_ari}
      ASTERISK_DEFAULT_CONTEXT: ${ASTERISK_DEFAULT_CONTEXT:-mcp-internal}
      ASTERISK_TRUNKS: ${ASTERISK_TRUNKS:-trunk-out}
      # Capacité de chaque trunk pour get_trunk_utilization
      # (ASTERISK_TRUNK_MAX_TRUNK_OUT=10 -> sans cette variable, 0%).
      ASTERISK_TRUNK_MAX_TRUNK_OUT: ${ASTERISK_TRUNK_MAX_TRUNK_OUT:-10}
      # LLM superviseur (llm_chat) : sans ces variables, l'adaptateur vise
      # http://localhost:11434 *dans* le conteneur -> outil toujours mort.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      # CPU : le 1er appel peut inclure le chargement du modèle en RAM. Mesuré à
      # ~210 s sous Docker Desktop (2,2 Go lus via la couche de fichiers) contre
      # ~8 s à chaud. D'où 300 s de timeout, pour rester correct même si
      # OLLAMA_KEEP_ALIVE est désactivé. La generation reste bornée.
      LLM_MAX_HISTORY: ${LLM_MAX_HISTORY:-8}
      LLM_NUM_PREDICT: ${LLM_NUM_PREDICT:-256}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
    volumes:
      - mcp_audit:/app/logs
    ports:
      - "${MCP_PORT:-8000}:8000"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/metrics',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Résolution du host depuis le conteneur (Asterisk bare-metal sur l'hôte).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [supervision-net]

  voice-pipeline:
    # Module 3 — pipeline vocal S2S (profil `voice` : non démarré par `up -d`
    # par défaut car l'image embarque faster-whisper + Piper, lourds).
    #   docker compose --profile voice up -d --build voice-pipeline
    #
    # Le conteneur est nommé `supervision-voice-pipeline` mais l'alias réseau
    # `voice-pipeline` permet à Prometheus de le résoudre (job `voice-pipeline`
    # dans monitoring/prometheus/prometheus.yml). Sans cet alias, le job reste
    # "down" avec l'erreur `lookup voice-pipeline: server misbehaving`.
    build:
      context: ./mcp-server
      dockerfile: Dockerfile.voice
    image: supervision-asterisk-mcp-voice-pipeline
    container_name: supervision-voice-pipeline
    profiles: ["voice"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASTERISK_ARI_BASE_URL: ${ASTERISK_ARI_BASE_URL:-http://asterisk:8088}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-mcp_ari}
      ASTERISK_ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-changeme_ari}
      ASTERISK_ARI_APP: ${ASTERISK_ARI_APP:-mcp-voice}
      # llama.cpp server (alias `ollama` sur supervision-net) — API compatible.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b-instruct}
      # Un modèle LLM à froid met ~200 s à se charger : le timeout doit le couvrir.
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      # `small` = ~14 s/tour en CPU (RTF 2.6) : réservé au GPU. `base` = ~2.3 s.
      # `tiny` = ~1.3 s : plus léger, pour systèmes à faibles ressources.
      STT_MODEL: ${STT_MODEL:-tiny}
      STT_DEVICE: ${STT_DEVICE:-cpu}
      TTS_VOICE: ${TTS_VOICE:-fr_FR-siwis-medium}
      # Adresse RTP annoncée à Asterisk. 0.0.0.0 => IP du conteneur déduite
      # (_guess_local_ip), correct si Asterisk est sur le même réseau Docker.
      # Bare-metal : mettre l'IP joignable par l'Asterisk hôte.
      VOICE_RTP_HOST: ${VOICE_RTP_HOST:-0.0.0.0}
      # Port de BASE : chaque appel concurrent prend 40001, 40002, …
      VOICE_RTP_PORT: ${VOICE_RTP_PORT:-40000}
      VOICE_METRICS_PORT: ${VOICE_METRICS_PORT:-9092}
      LATENCY_BUDGET_MS: ${LATENCY_BUDGET_MS:-20000}
      HF_HOME: /models/hf
      TTS_MODEL_DIR: /models/piper
      # Les modèles sont cuits dans l'image (Dockerfile.voice) : aucun volume sur
      # /models, sinon un volume vide masquerait Piper et Whisper. Un modèle
      # manquant fait échouer le démarrage au lieu de rendre du silence.
      VOICE_ALLOW_STUB: ${VOICE_ALLOW_STUB:-false}
    command: ["python", "-m", "src.voice.runner"]
    ports:
      - "${VOICE_METRICS_PORT:-9092}:${VOICE_METRICS_PORT:-9092}"
      # Asterisk étant sur le réseau Docker, il joint le conteneur directement
      # (IP:port). Cette publication sert au Asterisk hôte et au diagnostic
      # (injection RTP) : 16 ports, pas 64, pour ne pas réserver le hôte.
      - "${VOICE_RTP_PORT:-40000}-${VOICE_RTP_PORT_MAX:-40015}:${VOICE_RTP_PORT:-40000}-${VOICE_RTP_PORT_MAX:-40015}/udp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${VOICE_METRICS_PORT:-9092}/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Résolution du host depuis le conteneur (Asterisk bare-metal sur l'hôte).
    # Sans cette entrée, `host.docker.internal` ne résout pas sous Linux et le
    # pipeline crash au démarrage (ClientConnectorDNSError sur l'ARI).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      supervision-net:
        aliases:
          - voice-pipeline

networks:
  supervision-net:
    driver: bridge
    name: supervision-net

volumes:
  keycloak_db_data:
  mcp_audit:
