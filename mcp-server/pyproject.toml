[project]
name = "asterisk-mcp-server"
version = "0.2.0"
description = "Serveur MCP de supervision Asterisk (socle sécurité + outils télécoms + pipeline vocal S2S)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0,<4.0",
    "httpx>=0.27",
    "aiohttp>=3.9,<4.0",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.9",
    "panoramisk>=1.4",
]

[project.optional-dependencies]
# Module 3 — pipeline vocal Speech-to-Speech local.
# Lourd (faster-whisper tire ctranslate2 ; piper tire onnxruntime) : installé
# uniquement sur l'hôte qui exécute le pipeline audio.
voice = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "numpy>=1.26",
    "webrtcvad>=2.0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
asterisk-mcp = "src.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    "B008",    # CurrentAccessToken() en défaut d'argument = pattern officiel FastMCP
    "RUF012",  # annotations ClassVar non requises dans les tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
