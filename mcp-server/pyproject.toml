[project]
name = "asterisk-mcp-server"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.9",
    "panoramisk>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio", "pytest-cov", "ruff"]
