# Stack de supervision élargie : Ollama + Prometheus + Grafana.
# Rattachée au réseau `supervision-net` créé par le docker-compose.yml racine.
#
# Usage :
#   cd monitoring
#   cp .env.example .env
#   docker compose up -d

services:

  # llama.cpp server — alternative légère à Ollama (~150 MB vs ~2 Go).
  # Expose une API compatible Ollama (/api/chat) : le code OllamaLLM du serveur
  # MCP et du pipeline vocal fonctionne sans modification.
  # Modèle GGUF unique servi en RAM, rechargement instantané.
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: supervision-ollama
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "11434", "-c", "2048", "--n-gpu-layers", "0"]
    volumes:
      - ./models:/models:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      supervision-net:
        # alias `ollama` : résolu par le serveur MCP (OLLAMA_BASE_URL=http://ollama:11434)
        # et par le pipeline vocal. Le nom d'alias reste `ollama` pour ne pas
        # avoir à changer les variables d'environnement existantes.
        aliases:
          - ollama

  prometheus:
    image: prom/prometheus:latest
    container_name: supervision-prometheus
    secrets:
      # Prometheus n'expanse pas ${VAR} dans basic_auth.password : le mot de
      # passe est donc monté en fichier, lu via `password_file` dans
      # prometheus.yml. La valeur vient de monitoring/.env.
      - asterisk_metrics_password
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Asterisk tourne en bare metal sur l'hôte : le conteneur Prometheus doit
    # pouvoir résoudre `host.docker.internal` (cible du job `asterisk` dans
    # prometheus.yml). Inutile si Asterisk est un conteneur du réseau.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [supervision-net]

  grafana:
    image: grafana/grafana:latest
    container_name: supervision-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OIDC_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:-grafana}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:-changeme}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/${KEYCLOAK_REALM:-asterisk}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-asterisk}/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-asterisk}/protocol/openid-connect/userinfo
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [supervision-net]

networks:
  supervision-net:
    external: true
    name: supervision-net

volumes:
  prometheus_data:
  grafana_data:
  models:

secrets:
  # Secret dérivé de la variable d'environnement du même nom (monitoring/.env,
  # ou l'environnement du shell). Aucun secret n'est écrit dans le dépôt.
  asterisk_metrics_password:
    environment: ASTERISK_METRICS_PASSWORD
