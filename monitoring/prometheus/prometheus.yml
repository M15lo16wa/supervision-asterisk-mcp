# Scrape des composants du système de supervision.
# Toutes les cibles sont des conteneurs joints au réseau `supervision-net`
# (docker network connect supervision-net <conteneur>). Une cible absente est
# simplement marquée "down" par Prometheus — sans effet sur les autres.
# Le pipeline vocal (job voice-pipeline) doit tourner dans un conteneur nommé
# `voice-pipeline` pour être résolu ; sinon adapter la cible ci-dessous.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    stack: supervision-asterisk-mcp

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Serveur MCP (Modules 1 & 2) — route /metrics ajoutée à l'ASGI FastMCP.
  - job_name: mcp-server
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-server:8000"]

  # Pipeline vocal S2S (Module 3) — petit serveur aiohttp dédié.
  - job_name: voice-pipeline
    metrics_path: /metrics
    static_configs:
      - targets: ["voice-pipeline:9092"]

  # Asterisk (res_prometheus, exposé sur le serveur HTTP ARI, Basic Auth).
  # res_prometheus renvoie /metrics sans en-tête Content-Type -> on force le
  # protocole de repli, sinon Prometheus >= 3.0 rejette la cible.
  # Le secret n'est jamais écrit dans ce fichier : Prometheus n'expanse PAS
  # ${VAR} dans basic_auth, le compose monte donc la valeur de
  # ASTERISK_METRICS_PASSWORD (monitoring/.env) en fichier, via le secret
  # `asterisk_metrics_password`. Elle doit correspondre au mot de passe
  # configuré dans asterisk/config/prometheus.conf.
  # Prometheus n'expanse pas ${VAR} dans static_configs : l'hôte est donc en dur.
  # Cible bare metal : Asterisk tourne sur la machine hôte, le conteneur
  # Prometheus l'atteint via `host.docker.internal`, déclaré en `extra_hosts`
  # dans monitoring/docker-compose.yml (host-gateway).
  # Si vous revenez à Asterisk en conteneur, remettez `asterisk:8088` ET
  # retirez extra_hosts, en ajoutant l'alias réseau :
  #   docker network connect --alias asterisk supervision-net <conteneur>
  - job_name: asterisk
    metrics_path: /metrics
    scheme: http
    fallback_scrape_protocol: PrometheusText0.0.4
    basic_auth:
      username: prometheus
      password_file: /run/secrets/asterisk_metrics_password
    static_configs:
      - targets: ["host.docker.internal:8088"]

  # Ollama n'expose PAS /metrics au format Prometheus (404 sur /api/tags only) :
  # son usage se suit via le journal du serveur MCP (mcp_llm_calls_total).
  # Job volontairement absent — voir Grafana > "Ollama - requêtes" (panneau vide).
