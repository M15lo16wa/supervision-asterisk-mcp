[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
; requis pour que get_call_records reçoive les CDR temps réel
timestampevents = yes

; Compte AMI dédié au serveur MCP.
; `read` : classes d'événements reçus — `write` : actions autorisées.
; Pas de `originate`/`call` en écriture -> le pilotage passe par ARI si besoin ;
; ici on autorise le strict nécessaire aux outils Module 2.
;
; Les placeholders sont rendus par scripts/provision_asterisk.sh :
;   AMI_SECRET          <- ASTERISK_AMI_SECRET   (.env)
;   AMI_PERMIT_LINES    <- réseaux RFC1918 filtrés par ASTERISK_TRUSTED_CIDR
; NE PAS déclarer `permit = 0.0.0.0/0.0.0.0` : Asterisk retient la PREMIÈRE
; règle qui matche, donc un deny global annule toute autorisation et rend
; l'AMI inaccessible.
[mcp_ami]
secret = {{AMI_SECRET}}
deny = 0.0.0.0/0.0.0.0
{{AMI_PERMIT_LINES}}
read = system,call,cdr,dialplan,reporting,agent,user
write = call,reporting,command,originate
