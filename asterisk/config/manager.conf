[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
displayconnects = no
; requis pour que get_call_records reçoive les CDR temps réel
timestampevents = yes

; Compte AMI dédié au serveur MCP.
; `read` : classes d'événements reçus — `write` : actions autorisées.
; Pas de `originate`/`call` en écriture -> le pilotage passe par ARI si besoin ;
; ici on autorise le strict nécessaire aux outils Module 2.
[mcp_ami]
secret = changeme_ami
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = system,call,cdr,dialplan,reporting
write = call,reporting,command
