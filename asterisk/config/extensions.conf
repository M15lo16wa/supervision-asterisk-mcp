[general]
static = yes
writeprotect = no
clearglobalvars = no

[globals]
SUPERVISOR = PJSIP/1099

;=========================================================
; Contexte interne : appels entre postes + services MCP
;=========================================================
[internal]
; --- appels poste à poste ---
exten => _10XX,1,NoOp(Appel interne vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; --- hints pour list_extensions (état des terminaux) ---
; Bloc PRODUIT par scripts/create_pjsip_accounts.sh — ne pas éditer à la main.
; >>> HINTS-INTERNAL-BEGIN
exten => 1001,hint,PJSIP/1001
exten => 1002,hint,PJSIP/1002
exten => 1003,hint,PJSIP/1003
exten => 1004,hint,PJSIP/1004
exten => 1005,hint,PJSIP/1005
exten => 1006,hint,PJSIP/1006
exten => 1007,hint,PJSIP/1007
exten => 1008,hint,PJSIP/1008
exten => 1009,hint,PJSIP/1009
exten => 1010,hint,PJSIP/1010
exten => 1099,hint,PJSIP/1099
; <<< HINTS-INTERNAL-END

; --- 700 : assistant vocal Speech-to-Speech (Module 3) ---
exten => 700,1,NoOp(Entrée dans l'assistant vocal S2S)
 same => n,Answer()
 same => n,Stasis(mcp-voice)
 same => n,Hangup()

; --- 701 : écho de test audio (diagnostic latence/qualité, tests SIPp) ---
exten => 701,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- 800 : file d'attente "support" (get_queue_stats) ---
exten => 800,1,NoOp(Entrée file support)
 same => n,Answer()
 same => n,Queue(support,t,,,60)
 same => n,Hangup()

; --- _0. : appels sortants via le trunk (get_trunk_utilization) ---
exten => _0.,1,NoOp(Appel sortant ${EXTEN} via trunk-out)
 same => n,Dial(PJSIP/${EXTEN}@trunk-out,60)
 same => n,Hangup()

;=========================================================
; Contexte des appels entrants depuis le trunk
;=========================================================
[from-trunk]
exten => _X.,1,NoOp(Appel entrant trunk vers ${EXTEN})
 same => n,Goto(internal,${EXTEN},1)

;=========================================================
; Contexte de supervision : ChanSpy piloté par le serveur MCP
; (l'action AMI Originate lance directement l'application ChanSpy,
;  ce contexte sert de repli / test manuel depuis un poste)
;=========================================================
[supervision]
exten => _8XXX,1,NoOp(Supervision du poste ${EXTEN:1})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:1},qE)
 same => n,Hangup()

;=========================================================
; Contexte MCP — valeur par défaut de ASTERISK_DEFAULT_CONTEXT
; (.env). Utilisé par originate_call et redirect_call côté serveur MCP.
; DOIT contenir les extensions routées : un contexte vide ferait échouer
; toute origination. Les canaux External Media / Snoop restent hors dialplan.
;=========================================================
[mcp-internal]
exten => _10XX,1,NoOp(MCP: appel interne vers ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; --- hints (get_extension_status) ---
; Bloc PRODUIT par scripts/create_pjsip_accounts.sh — ne pas éditer à la main.
; >>> HINTS-MCP-BEGIN
exten => 1001,hint,PJSIP/1001
exten => 1002,hint,PJSIP/1002
exten => 1003,hint,PJSIP/1003
exten => 1004,hint,PJSIP/1004
exten => 1005,hint,PJSIP/1005
exten => 1006,hint,PJSIP/1006
exten => 1007,hint,PJSIP/1007
exten => 1008,hint,PJSIP/1008
exten => 1009,hint,PJSIP/1009
exten => 1010,hint,PJSIP/1010
exten => 1099,hint,PJSIP/1099
; <<< HINTS-MCP-END

; --- 700 : assistant vocal Speech-to-Speech (Module 3) ---
exten => 700,1,NoOp(Entrée assistant vocal S2S)
 same => n,Answer()
 same => n,Stasis(mcp-voice)
 same => n,Hangup()

; --- 701 : écho de test (diagnostic latence/qualité, SIPp) ---
exten => 701,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; --- 800 : file d'attente (get_queue_stats) ---
exten => 800,1,NoOp(Entrée file support)
 same => n,Answer()
 same => n,Queue(support,t,,,60)
 same => n,Hangup()

; --- _0. : appels sortants via le trunk (get_trunk_utilization) ---
; Inactif si le trunk n'a pas été provisionné (bloc retiré du pjsip.conf).
exten => _0.,1,NoOp(Call outbound ${EXTEN} via trunk-out)
 same => n,Dial(PJSIP/${EXTEN}@trunk-out,60)
 same => n,Hangup()
