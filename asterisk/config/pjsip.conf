;======================= Trunk SIP sortant =======================
; Ce bloc n'est déployé QUE si ASTERISK_TRUNK_HOST, ASTERISK_TRUNK_USER et
; ASTERISK_TRUNK_SECRET sont renseignés dans le .env ; sinon le provisionneur
; le retire (le trunk reste alors « absent », et non un dummy qui plantait au
; chargement). `get_trunk_utilization` le reconnaît grâce au préfixe "trunk".
; >>> TRUNK-BEGIN
; Exemple de trunk vers un opérateur. Capacité indicative :
; ASTERISK_TRUNK_MAX_TRUNK-OUT=10 dans le .env du serveur MCP.
[trunk-out]
type = registration
outbound_auth = trunk-out-auth
server_uri = sip:{{TRUNK_HOST}}
client_uri = sip:{{TRUNK_USER}}@{{TRUNK_HOST}}
retry_interval = 60

[trunk-out-auth]
type = auth
auth_type = userpass
username = {{TRUNK_USER}}
password = {{TRUNK_SECRET}}

[trunk-out](aor)
max_contacts = 1
remove_existing = yes

[trunk-out](endpoint)
type = trunk
aors = trunk-out

[trunk-out]
type = identify
endpoint = trunk-out
match = {{TRUNK_HOST}}
; <<< TRUNK-END
