;======================= Transport =======================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

;==================== Modèles d'endpoint ==================
[endpoint-internal](!)
type = endpoint
context = internal
disallow = all
allow = ulaw
allow = alaw
allow = slin16
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes

;===================== Postes agents ======================
[1001](endpoint-internal)
auth = 1001
aors = 1001
callerid = Agent 1001 <1001>

[1001](auth-userpass)
username = 1001
password = agent1001pass

[1001](aor-single)

[1002](endpoint-internal)
auth = 1002
aors = 1002
callerid = Agent 1002 <1002>

[1002](auth-userpass)
username = 1002
password = agent1002pass

[1002](aor-single)

;================== Poste superviseur =====================
[1099](endpoint-internal)
auth = 1099
aors = 1099
callerid = Superviseur <1099>

[1099](auth-userpass)
username = 1099
password = superviseur1099pass

[1099](aor-single)

;======================= Trunk SIP sortant =======================
; Exemple de trunk vers un opérateur. `get_trunk_utilization` le reconnaît
; grâce au préfixe "trunk" (ou via ASTERISK_TRUNKS). Capacité indicative :
; ASTERISK_TRUNK_MAX_TRUNK-OUT=10 dans le .env du serveur MCP.
[trunk-out]
type = registration
outbound_auth = trunk-out-auth
server_uri = sip:sip.operateur.example
client_uri = sip:0033000000@sip.operateur.example
retry_interval = 60

[trunk-out-auth]
type = auth
auth_type = userpass
username = 0033000000
password = CHANGE_ME_TRUNK_SECRET

[trunk-out]
type = aor
contact = sip:sip.operateur.example

[trunk-out]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw,alaw
outbound_auth = trunk-out-auth
aors = trunk-out
from_user = 0033000000
from_domain = sip.operateur.example

[trunk-out]
type = identify
endpoint = trunk-out
match = sip.operateur.example
