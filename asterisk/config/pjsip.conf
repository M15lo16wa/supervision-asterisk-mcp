;======================= Transport =======================
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

;==================== Modèles d'endpoint ==================
[endpoint-internal](!)
type = endpoint
context = internal
disallow = all
allow = ulaw
allow = alaw
allow = slin16
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[auth-userpass](!)
type = auth
auth_type = userpass

[aor-single](!)
type = aor
max_contacts = 1
remove_existing = yes

