[general]
enabled = yes
core_metrics_enabled = yes
uri = metrics

; Basic Auth pour /metrics — doit correspondre au bloc basic_auth du job
; "asterisk" dans monitoring/prometheus/prometheus.yml.
; Le mot de passe est rendu par scripts/provision_asterisk.sh depuis
; ASTERISK_METRICS_PASSWORD (.env).
auth_username = prometheus
auth_password = {{METRICS_PASSWORD}}
