[general]
enabled = yes
pretty = yes
allowed_origins = *

; Utilisateur ARI dédié au serveur MCP et au pipeline vocal.
; Le mot de passe est rendu par scripts/provision_asterisk.sh depuis
; ASTERISK_ARI_PASSWORD (.env) — ne pas laisser le placeholder tel quel.
[mcp_ari]
type = user
read_only = no
password = {{ARI_PASSWORD}}
password_format = plain
