;======================================================================
; asterisk.conf — volontairement minimal.
;
; NE PAS déclarer [directories] ici.
;
; Les chemins (astmoddir, astdbdir, astkeydir, astagidir, astspooldir,
; astrundir, astlogdir, astcachedir...) sont propres à la distribution et
; sont DÉJÀ corrects dans le binaire compilé. Les écrire ici les écrase :
; c'est exactement ce qu'un ancien modèle faisait, en aplatissant astdbdir,
; astkeydir et astagidir sur astvarlibdir. Conséquence observée sur Ubuntu :
;
;   WARNING loader.c: 'modules.conf' invalid or missing.
;   ERROR   asterisk.c: Module initialization failed. ASTERISK EXITING!
;
; et Asterisk ne démarre plus du tout. Sur une machine où le paquet a été
; installé sans l'utilisateur système `asterisk`, on obtient en plus :
;
;   No such group 'asterisk'!
;
; Le compte est créé par scripts/provision_asterisk.sh (ensure_asterisk_user).
;
; Seul [options] est piloté ici.
;======================================================================
[options]
; Exécution sous un compte dédié plutôt que root : recommandé par Asterisk.
; Ces deux clés rendent le démarrage impossible si le compte n'existe pas —
; d'où la création en amont par le script de provisionnement.
runuser = asterisk
rungroup = asterisk
documentation_language = en_US